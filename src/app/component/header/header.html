<header>
  <div class="logo">
    <a routerLink="/">F.CUSTOM</a>
  </div>

  <div class="pesquisa">
  <input
    type="text"
    placeholder="Pesquisar produto"
    [value]="termo()"
    (input)="digitar($any($event.target).value)"
    (keydown.enter)="pesquisar()"
    (keydown.escape)="aberto.set(false)"
    (blur)="aberto.set(false)"
  />
  <span (click)="pesquisar()">⌕</span>

  @if (aberto() && sugestoes().length) {
    <ul class="sugestoes">
      @for (p of sugestoes(); track p.id) {
        <li (mousedown)="escolher(p)">{{ p.nome }}</li>
      }
    </ul>
  }
</div>

  <div class="opcoes">
    <div class="fale-conosco">
      <img src="/images/faleConosco.jpg" alt="Fale Conosco">
      <span>Fale Conosco</span>
    </div>

    <div class="usuario">

      <div class="usuario-link">
        @if (auth.isLogado()) {
          <a routerLink="/perfil">
            <img src="/images/usuario.png" class="icone" alt="Usuário">
          </a>
        } @else {
          <img src="/images/usuario.png" class="icone" alt="Usuário">
        }
      </div>

      <div class="dropdown">
        @if (auth.isAdmin()) {
          <a routerLink="/admin">Painel Admin</a>
          <a href="#" (click)="sair(); $event.preventDefault()">Sair</a>
        } @else if (auth.isLogado()) {
          <a routerLink="/perfil">Meu perfil</a>
          <a href="#" (click)="sair(); $event.preventDefault()">Sair</a>
        } @else {
          <a routerLink="/login">Entrar</a>
          <a routerLink="/register">Criar conta</a>
        }
      </div>

    </div>

    <img class="icone" src="/images/carrinho.png" alt="Carrinho">
  </div>
</header>
