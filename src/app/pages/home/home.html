<div class="barra-titulo">F Company</div>

<app-banner></app-banner>

<div class="barra-titulo">Selecionados a dedo</div>

<div class="grade-produtos">
  @for (produto of produtosDestaque; track produto.id) {
    <div class="card-produto hSizeCard" (click)="abrirProduto(produto)">
      <img [src]="produto.imagem" [alt]="produto.nome">
      <div class="card-info">
        <div class="card-categoria">{{ produto.categoria }}</div>
        <div class="card-nome">{{ produto.nome }}</div>
        <div class="card-preco">{{ formatarPreco(produto.preco) }}</div>
      </div>
    </div>
  }
</div>
