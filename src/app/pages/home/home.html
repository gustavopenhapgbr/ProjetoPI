<div class="section-titulo">
    <h1 class="titulo">Produtos em destaque</h1>
    <p>Selecionados a dedo.</p>
</div>

<section class="destaques">
    @if (produtosDestaque.length > 0) {
        <div class="barra-categoria">
            <span>{{ produtosDestaque.length }} produto{{ produtosDestaque.length === 1 ? '' : 's' }}</span>
            <span class="linha"></span>
        </div>

        <div class="grade">
            @for (produto of produtosDestaque; track produto.id) {
                <app-card (click)="irPageProduto(produto)" [produto]="produto"></app-card>
            }
        </div>
    } @else {
        <p class="sem-produtos">Nenhum produto cadastrado nesta categoria.</p>
    }
</section>
