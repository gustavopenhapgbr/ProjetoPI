<h1 class="titulo">Produtos em destaque</h1>

<div class="container" *ngIf="produtosDestaque.length > 0">
    <div class="grade">
        @for (produto of produtosDestaque; track produto.id) {
            <app-card (click)="irPageProduto(produto)" [produto]="produto"></app-card>
        }
    </div>
</div>

<p class="sem-produtos" *ngIf="produtosDestaque.length === 0">
    Nenhum produto em destaque no momento.
</p>
