<div class="pagina-central">
  <div class="caixa-auth">
    <div class="cabecalho-pagina">
      <div>
        <span class="auth-tag">F Company</span>
        <h1>Recuperar senha</h1>
      </div>
    </div>

    <div class="caixa">
      <div class="caixa-topo">Esqueceu sua senha?</div>

      <form class="auth-corpo">
        <p class="auth-subtitulo">Digite o e-mail da sua conta para receber um link de redefinição.</p>

        <div class="auth-campo">
          <label for="email">E-mail</label>
          <input
            class="campo-input"
            id="email"
            name="email"
            type="email"
            placeholder="seu@email.com"
            [(ngModel)]="email"
            (input)="validarFormulario()">
        </div>

        <button
          type="button"
          class="btn-padrao auth-btn"
          [disabled]="botaoDesabilitado"
          (click)="enviarLink()">
          Enviar link
        </button>

        <div class="auth-rodape">
          Lembrou sua senha? <a routerLink="/login" class="auth-link">Voltar para o login</a>
        </div>
      </form>
    </div>
  </div>
</div>
