<section class="pagina-categoria">
  <div class="trilha">
    <a routerLink="/">Início</a>
    <span>/</span>
    <strong>Shorts</strong>
  </div>

  <div class="cabecalho-categoria">
    <span class="eyebrow">Coleção F.COMPANY</span>
    <h1>Shorts</h1>
    <p>Leveza e estilo para acompanhar sua rotina.</p>
  </div>

  @if (produtos.length > 0) {
    <div class="barra-categoria">
      <span>{{ produtos.length }} produto{{ produtos.length === 1 ? '' : 's' }}</span>
      <span class="linha"></span>
    </div>
    <div class="grade">
      @for (produto of produtos; track produto.id) {
        <app-card (click)="irParaOproduto(produto)" [produto]="produto"></app-card>
      }
    </div>
  } @else {
    <p>Nenhum produto cadastrado nesta categoria.</p>
  }
</section>
