<div class="pagina-auth">
  <div class="luz-roxa luz-1"></div>
  <div class="luz-roxa luz-2"></div>

  <div class="auth-split">
    <div class="auth-imagem">
      <img src="images/loginbackground.jpeg" alt="F Company">
      <div class="auth-marca">F Company</div>
      <div class="auth-imagem-texto">
        <h2>Seja você mesmo</h2>
        <p>Estilo urbano, conforto e identidade em cada peça.</p>
      </div>
    </div>

    <form class="auth-form-lado">
      <span class="auth-tag">Acesso à conta</span>
      <h1>Entrar</h1>
      <p class="auth-subtitulo">Entre com sua conta para continuar comprando.</p>

      <div class="auth-campo">
        <label for="email">E-mail</label>
        <input
          class="campo-input"
          id="email"
          name="email"
          type="email"
          placeholder="seu@email.com"
          [(ngModel)]="email"
          (input)="validarFormulario()">
      </div>

      <div class="auth-campo">
        <div class="auth-topo-campo">
          <label for="senha">Senha</label>
          <a routerLink="/forgot-password" class="auth-link">Esqueceu a senha?</a>
        </div>
        <input
          class="campo-input"
          id="senha"
          name="senha"
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="senha"
          (input)="validarFormulario()">
      </div>

      <button
        type="button"
        class="btn-padrao auth-btn"
        [disabled]="botaoDesabilitado"
        (click)="entrar()">
        Entrar
      </button>

      <div class="auth-rodape">
        Não tem conta? <a routerLink="/register" class="auth-link">Criar conta</a>
      </div>
    </form>
  </div>
</div>
