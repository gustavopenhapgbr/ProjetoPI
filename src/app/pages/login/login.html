<div class="content-container">
  <form (ngSubmit)="entrar()">
    <img src="images/guaxinim.png" alt="F.CUSTOM" class="mascote">

    <h1>Bem-vindo</h1>
    <p>Entre para continuar comprando</p>

    <label for="email">E-mail</label>
    <input class="input-simples" id="email" name="email"
      type="email" placeholder="" [(ngModel)]="email" />

    <div class="linha-senha">
      <label for="input-senha">Senha</label>
      <a routerLink="/forgot-password" class="link">Esqueceu a senha?</a>
    </div>
    <input class="input-simples" id="input-senha" name="input-senha"
      type="password" placeholder="" [(ngModel)]="senha" />

    <button type="submit" class="input-submeter">Entrar</button>

    <span class="cadastro">
      Não tem conta? <a routerLink="/register" class="link">Criar conta</a>
    </span>
  </form>
</div>
