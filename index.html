<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F.CUSTOM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <header>

        <div class="logo">
            F.CUSTOM
        </div>


        <div class="pesquisa">

            <input type="text" placeholder="Pesquisar produto">

            <span>⌕</span>

        </div>


        <div class="opcoes">

            <div class="fale-conosco">

                <img src="images/faleConosco.jpg" alt="Fale Conosco">

                <span>Fale Conosco</span>

            </div>


            <img
                class="icone"
                src="images/carrinho.png"
                alt="Carrinho"
            >


            <img
                class="icone usuario"
                src="images/usuario.png"
                alt="Usuário"
            >

        </div>

    </header>



    <nav>

        <a href="#">Camisetas</a>

        <a href="#">Shorts</a>

        <a href="#">Calças</a>

        <a href="#">Conjuntos</a>

    </nav>




    <section class="banner">

        <img src="images/banner.gif" alt="Banner F.CUSTOM">

        <div class="texto-banner">

            <h1>
                TRANSFORME<br>
                O SEU ESTILO!
            </h1>

            <p>
                Aqui na F.CUSTOM o seu estilo é ÚNICO.<br>
                Você imagina, personaliza e veste a sua ideia.
            </p>

            <button>
                Ver produtos
            </button>

        </div>

    </section>

</body>

</html>
